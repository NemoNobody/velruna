name: Image

# The container image is published for release tags only, built from the same
# commit as the binaries: a semver-tagged image in a public registry is what
# users pin. There is deliberately no edge/master image — a moving "latest"
# built from every push would be a support burden and a supply-chain surprise.
#
# workflow_dispatch is the repair path for an existing tag, mirroring
# release.yml: pass the tag name and the image is rebuilt and re-pushed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag to publish an image for, e.g. v0.9.0"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref }}

      # A tag can point at a commit whose CI is red (a force-pushed or mistyped
      # tag): the image must not be the first thing that notices.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go build ./...
          go vet ./...
          go test ./...
      # The lint check is part of `make ci`: without it a tag whose lint is red
      # would still publish an image.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      # GHCR rejects uppercase repository owners, and a dispatched run must
      # derive its tags from the input rather than from the branch ref. The
      # semver shape is enforced: a stray tag (or a branch name typed into the
      # dispatch box) must never publish "latest".
      - name: Compute image name and tags
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
          REF: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          case "$REF" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::not a release tag: $REF (expected vX.Y.Z)"; exit 1 ;;
          esac
          semver="${REF#v}"
          if ! printf '%s' "$semver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::not a semantic version: $semver"; exit 1
          fi
          major_minor="$(printf '%s' "$semver" | cut -d. -f1,2)"
          {
            echo "owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
            echo "ref=$REF"
            echo "semver=$semver"
            echo "major_minor=$major_minor"
            echo "sha=$(git rev-parse --short HEAD)"
            # A pre-release must not take the "latest" slot: release.yml marks
            # rc tags as prereleases for the same reason.
            if printf '%s' "$semver" | grep -q -- '-'; then
              echo "prerelease=true"
            else
              echo "prerelease=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ steps.img.outputs.owner }}/velruna
          tags: |
            type=raw,value=${{ steps.img.outputs.semver }}
            type=raw,value=${{ steps.img.outputs.major_minor }},enable=${{ steps.img.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.img.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=velruna
            org.opencontainers.image.description=Verified-fact memory for AI agents: MCP server and CLI, OpenSearch-backed
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.img.outputs.semver }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The binaries stamp the tag (v0.9.0) — keep the image identical so
          # `velruna status` from a container matches a plain install.
          build-args: |
            VERSION=${{ steps.img.outputs.ref }}
            COMMIT=${{ steps.img.outputs.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
