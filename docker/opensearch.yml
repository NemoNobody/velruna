# Single-node OpenSearch for development and single-machine installs.
# podman-compose / docker compose compatible.
#
# Dev posture: security plugin OFF, port bound to 127.0.0.1 only. That is the
# documented dev rule: plaintext credentials are acceptable while the node
# cannot be reached off this machine. For anything shared, enable the security
# plugin (demo config or real certificates) and use a real password.
name: velruna-os

services:
  opensearch:
    # OPENSEARCH_IMAGE/OSD_IMAGE override the tags for version-matrix testing
    # (hack/version-matrix.sh) or pinning; defaults are the verified pair.
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:3.8.0}
    container_name: velruna-opensearch
    profiles: ["single"]
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms${VELRUNA_OS_HEAP:-512m} -Xmx${VELRUNA_OS_HEAP:-512m}
      # snapshots land in ./os-snapshots on the host (see docs/backup.md §5:
      # snapshot before `down`, containers lose anonymous data on prune)
      - OPENSEARCH_PATH_REPO=/snapshots
    volumes:
      # named volume: survives `compose down` (anonymous volumes get pruned)
      - velruna-os-data:/usr/share/opensearch/data
      - ./os-snapshots:/snapshots
    ports:
      # VELRUNA_OS_PORT lets a machine that already runs OpenSearch on 9200
      # run the dev node side by side (e.g. VELRUNA_OS_PORT=9299 make dev-opensearch)
      - "127.0.0.1:${VELRUNA_OS_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 60

  # Optional UI (make dev-opensearch-dashboards). The compose profile keeps
  # it out of the plain dev-opensearch up/down cycle: only the dashboards
  # target pulls it in. Security plugin is off on the dev node, so the UI
  # opens without login; bound to 127.0.0.1 like the API.
  dashboards:
    image: ${OSD_IMAGE:-opensearchproject/opensearch-dashboards:3.8.0}
    container_name: velruna-opensearch-dashboards
    profiles: ["dashboards"]
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      # VELRUNA_DASH_PORT avoids a clash with an existing dashboards install
      - "127.0.0.1:${VELRUNA_DASH_PORT:-5601}:5601"

  # --- velruna itself (make stack-up) ---
  # The CLI and the MCP server from the image the release workflow publishes
  # (ghcr.io/nemonobody/velruna). The service is meant to be run, not left up:
  #   docker compose -f docker/opensearch.yml --profile single --profile app \
  #     run --rm velruna status
  #   ... run --rm -T velruna mcp        # for an MCP client
  # stdio transport: the client starts the process, so no port is published.
  # A container has no session bus, so the OS keyring is unreachable — the
  # password comes from the mounted config or OPENSEARCH_PASSWORD.
  velruna:
    image: ${VELRUNA_IMAGE:-ghcr.io/nemonobody/velruna:latest}
    container_name: velruna-app
    profiles: ["app"]
    depends_on:
      opensearch:
        condition: service_healthy
    command: ["status"]
    # The mounted config carries no credentials; the dev node runs with the
    # security plugin off, so a dummy pair is enough. Both are overridable for a
    # secured store: OPENSEARCH_USER=admin OPENSEARCH_PASSWORD=... make stack-up
    environment:
      - VELRUNA_CONF=/etc/velruna/velruna.conf
      - OPENSEARCH_USER=${OPENSEARCH_USER:-dev}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:-dev}
      # Provenance labels are self-reported and default to the OS user, which
      # inside a container is "nonroot". Set these so facts written from the
      # container carry a useful author/host.
      - VELRUNA_AUTHOR=${VELRUNA_AUTHOR:-}
      - VELRUNA_HOST=${VELRUNA_HOST:-}
    volumes:
      - ${VELRUNA_CONF_FILE:-./velruna.container.conf}:/etc/velruna/velruna.conf:ro
    # The binary only reads: a writable root filesystem would be pure attack
    # surface, and no escalation is needed for anything it does.
    read_only: true
    security_opt:
      - no-new-privileges:true

  # --- Dashboards WITH security (make dev-opensearch-secure-dashboards) ---
  # The dev dashboards service above forces the security plugin off, which is
  # right for a throwaway node and wrong for a server install. This one talks to
  # the secured node over https, logs in with the admin credentials and skips
  # certificate verification because the node uses the demo certificates.
  #   UI: https://127.0.0.1:5643  (VELRUNA_DASH_SECURE_PORT to move it)
  #   login: admin / the password passed to make (VELRUNA_SECURE_DEV_PASSWORD)
  dashboards-secure:
    image: ${OSD_IMAGE:-opensearchproject/opensearch-dashboards:3.8.0}
    container_name: velruna-opensearch-dashboards-secure
    profiles: ["secure-dash"]
    restart: unless-stopped
    depends_on:
      opensearch-secure:
        condition: service_healthy
    environment:
      - 'OPENSEARCH_HOSTS=["https://opensearch-secure:9200"]'
      - OPENSEARCH_USERNAME=${OPENSEARCH_USER:-admin}
      - "OPENSEARCH_PASSWORD=${VELRUNA_SECURE_DEV_PASSWORD:-}"
      # Demo certificates: verification off is the documented trade-off for a
      # local stack. A real install uses real certificates and drops this.
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
    ports:
      - "127.0.0.1:${VELRUNA_DASH_SECURE_PORT:-5643}:5601"

  # --- 3-node cluster (make dev-opensearch-cluster) ---
  # Bare topology test: how velruna indices, their shards and replicas live
  # on a real cluster. Security stays off (test posture), all ports loopback.
  #   node1: 127.0.0.1:9400  node2: 127.0.0.1:9401  node3: 127.0.0.1:9402
  opensearch-node1: &cluster-node
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:3.8.0}
    container_name: velruna-os-node1
    profiles: ["cluster"]
    restart: unless-stopped
    environment: &cluster-env
      - cluster.name=velruna-cluster
      - node.name=opensearch-node1
      - discovery.seed_hosts=${VELRUNA_CLUSTER_SEEDS:-opensearch-node1,opensearch-node2,opensearch-node3}
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2,opensearch-node3
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms${VELRUNA_OS_HEAP:-512m} -Xmx${VELRUNA_OS_HEAP:-512m}
      - OPENSEARCH_PATH_REPO=/snapshots
    volumes:
      - velruna-os-n1-data:/usr/share/opensearch/data
      - ./os-snapshots:/snapshots
    ports:
      - "127.0.0.1:9400:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 60

  opensearch-node2:
    <<: *cluster-node
    container_name: velruna-os-node2
    environment:
      - cluster.name=velruna-cluster
      - node.name=opensearch-node2
      - discovery.seed_hosts=${VELRUNA_CLUSTER_SEEDS:-opensearch-node1,opensearch-node2,opensearch-node3}
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2,opensearch-node3
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms${VELRUNA_OS_HEAP:-512m} -Xmx${VELRUNA_OS_HEAP:-512m}
      - OPENSEARCH_PATH_REPO=/snapshots
    volumes:
      - velruna-os-n2-data:/usr/share/opensearch/data
      - ./os-snapshots:/snapshots
    ports:
      - "127.0.0.1:9401:9200"

  opensearch-node3:
    <<: *cluster-node
    container_name: velruna-os-node3
    environment:
      - cluster.name=velruna-cluster
      - node.name=opensearch-node3
      - discovery.seed_hosts=${VELRUNA_CLUSTER_SEEDS:-opensearch-node1,opensearch-node2,opensearch-node3}
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2,opensearch-node3
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms${VELRUNA_OS_HEAP:-512m} -Xmx${VELRUNA_OS_HEAP:-512m}
      - OPENSEARCH_PATH_REPO=/snapshots
    volumes:
      - velruna-os-n3-data:/usr/share/opensearch/data
      - ./os-snapshots:/snapshots
    ports:
      - "127.0.0.1:9402:9200"

  # --- single node WITH security (make dev-opensearch-secure) ---
  # Auth/https smoke: demo security config is installed by the image entry
  # point (since 2.12) using OPENSEARCH_INITIAL_ADMIN_PASSWORD, which the
  # Makefile requires in the environment — never bake a password here.
  # MCP/CLI side: insecure_skip_verify=true in the config for demo certs.
  #   endpoint: https://127.0.0.1:9443
  opensearch-secure:
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:3.8.0}
    container_name: velruna-os-secure
    profiles: ["secure"]
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      # the make target refuses to run without the password set (compose
      # interpolates the whole file, so no required-variable syntax here)
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=${VELRUNA_SECURE_DEV_PASSWORD:-}"
      - OPENSEARCH_JAVA_OPTS=-Xms${VELRUNA_OS_HEAP:-512m} -Xmx${VELRUNA_OS_HEAP:-512m}
    ports:
      - "127.0.0.1:9443:9200"
    healthcheck:
      # The demo security config answers 401 without credentials, so the probe
      # must log in: an unauthenticated curl -f made this node permanently
      # unhealthy the moment anything depended on it. $$ escapes the compose
      # interpolation and leaves $OPENSEARCH_INITIAL_ADMIN_PASSWORD to the shell.
      test: ["CMD-SHELL", "curl -sk -u admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD https://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 60

# named volume for the data dir: must be declared at the top level,
# compose v2 refuses services referencing undeclared volumes
volumes:
  velruna-os-data:
  velruna-os-n1-data:
  velruna-os-n2-data:
  velruna-os-n3-data:
